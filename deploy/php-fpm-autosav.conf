; ============================================================
; AUTOSAV — Pool PHP-FPM production
; Fichier : /etc/php/8.2/fpm/pool.d/autosav.conf
;
; ⚠️  APPLICABLE UNIQUEMENT SUR VPS / CLOUD / SERVEUR DÉDIÉ AVEC
;     ACCÈS ROOT (nécessite de créer un utilisateur système dédié
;     et d'éditer la config PHP-FPM). Confirmé non applicable sur
;     l'hébergement mutualisé Hostinger actuel : la version PHP et
;     ses limites (memory_limit, upload_max_filesize...) se règlent
;     uniquement via hPanel → Sites Web → PHP. Conservé pour une
;     migration future.
; ============================================================

[autosav]

; ── Utilisateur applicatif (créer un user dédié, pas www-data) ──
user  = autosav
group = autosav

; ── Socket Unix (plus rapide qu'un TCP sur même machine) ─────────
listen = /run/php/php8.2-fpm-autosav.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ── Gestionnaire de processus : dynamic ──────────────────────────
; Adapter pm.max_children selon la RAM disponible.
; Règle de base : RAM totale / RAM par process PHP (~30-50 Mo).
; Exemple pour 1 Go RAM : 1024 / 40 = ~25 workers max.
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests      = 500       ; Redémarre le worker après 500 requêtes (évite les fuites mémoire)

; ── Timeouts ─────────────────────────────────────────────────────
request_terminate_timeout = 60s
request_slowlog_timeout   = 5s
slowlog                   = /var/log/php-fpm/autosav-slow.log

; ── Sécurité ─────────────────────────────────────────────────────
; Restreindre le chroot si votre infra le permet
; chroot = /var/www/autosav/current

; ── Variables d'environnement transmises ─────────────────────────
; Les variables .env sont chargées par l'application elle-même.
; Seules les variables système nécessaires sont transmises.
env[PATH]     = /usr/local/bin:/usr/bin:/bin
env[TMP]      = /tmp
env[TMPDIR]   = /tmp
env[TEMP]     = /tmp
; Permet à PHP de lire les variables d'environnement du process parent
env[APP_ENV]  = production

; ── Overrides PHP.ini pour ce pool ───────────────────────────────
php_admin_value[error_log]           = /var/log/php-fpm/autosav-error.log
php_admin_flag[log_errors]           = on
php_admin_value[memory_limit]        = 256M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size]       = 12M
php_admin_value[max_execution_time]  = 60
php_admin_value[max_input_time]      = 30

; Désactiver les fonctions dangereuses (defense in depth)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,proc_open,proc_nice,proc_get_status,proc_close,pfsockopen,dl,show_source,highlight_file,parse_ini_file,phpinfo
; NOTE : BackupService utilise exec() pour mysqldump — si vous activez cette
; restriction, exécutez les backups via un script CLI dédié hors du pool web.

; Masquer la signature PHP
php_admin_flag[expose_php]           = off
php_admin_value[display_errors]      = 0
php_admin_value[display_startup_errors] = 0
php_admin_value[error_reporting]     = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Sessions (géré par l'application, mais sécuriser le php.ini aussi)
php_admin_value[session.save_handler]  = files
php_admin_value[session.save_path]     = /var/www/autosav/shared/storage/sessions
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure]   = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.gc_maxlifetime] = 1800
