<VirtualHost *:443>
    ServerName autosav.example.tld
    DocumentRoot /var/www/autosav/public

    <Directory /var/www/autosav/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/autosav_error.log
    CustomLog ${APACHE_LOG_DIR}/autosav_access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/autosav.example.tld/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/autosav.example.tld/privkey.pem
</VirtualHost>
