# ============================================================
# AUTOSAV — VirtualHost Nginx production
# Nginx 1.18+ avec HTTP/2, PHP-FPM, rate limiting, hardening
#
# ⚠️  APPLICABLE UNIQUEMENT SUR VPS / CLOUD / SERVEUR DÉDIÉ AVEC
#     ACCÈS ROOT. Confirmé non applicable sur l'hébergement
#     mutualisé Hostinger actuel de ce projet. Conservé pour une
#     migration future — voir RUNBOOK_DEPLOIEMENT.md.
# ============================================================

# ── Rate limiting zones ──────────────────────────────────
# Définir dans nginx.conf (http context), pas dans server context.
# limit_req_zone $binary_remote_addr zone=autosav_login:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=autosav_api:10m   rate=60r/m;
# limit_req_zone $binary_remote_addr zone=autosav_global:20m rate=200r/m;

# ── Redirection HTTP → HTTPS ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name devnenad.fr www.devnenad.fr;

    # Autoriser uniquement le renouvellement Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── VirtualHost HTTPS principal ───────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name devnenad.fr www.devnenad.fr;

    # ── Document root = public/ uniquement ────────────────
    root /var/www/autosav/current/public;
    index index.php;

    # ── TLS ───────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/devnenad.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devnenad.fr/privkey.pem;

    # Protocoles et ciphers Mozilla Modern
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling
    ssl_stapling            on;
    ssl_stapling_verify     on;
    ssl_trusted_certificate /etc/letsencrypt/live/devnenad.fr/chain.pem;
    resolver                1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout        5s;

    # ── En-têtes de sécurité ──────────────────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none"                                  always;

    # Masquer la version Nginx
    server_tokens off;

    # ── Taille maximale des requêtes (uploads) ─────────────
    client_max_body_size 10m;

    # ── Timeouts ──────────────────────────────────────────
    client_body_timeout   12s;
    client_header_timeout 12s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # ── Rate limiting ─────────────────────────────────────
    # Login : 5 req/min par IP
    location = /auth/login {
        limit_req zone=autosav_login burst=2 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # AJAX : 60 req/min par IP
    location ^~ /ajax/ {
        limit_req zone=autosav_api burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    # ── Routing principal → front controller ──────────────
    location / {
        limit_req zone=autosav_global burst=50 nodelay;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ── PHP-FPM ───────────────────────────────────────────
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass  unix:/run/php/php8.2-fpm.sock;

        # Sécurité : ne pas exécuter les .php dans les uploads
        fastcgi_param PHP_VALUE "cgi.fix_pathinfo=0";

        # Timeouts PHP
        fastcgi_read_timeout  300s;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout  60s;

        # Buffers pour éviter les fichiers temporaires
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Blocage des répertoires et fichiers sensibles ─────
    location ~ ^/(Core|Modules|config|vendor|storage|database|tests|docs|deploy|bin)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(sql|log|zip|tar|gz|bak|phar|sh|bat|ps1|env|ini|lock)$ {
        deny all;
        return 404;
    }

    # ── Assets statiques (cache aggressif) ────────────────
    location ~* \.(css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Health check (IP serveur de monitoring seulement) ─
    location = /health.php {
        # Autoriser uniquement le monitoring interne et les IPs de confiance
        # allow 10.0.0.0/8;
        # deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # ── Journaux structurés ────────────────────────────────
    access_log /var/log/nginx/autosav_access.log combined;
    error_log  /var/log/nginx/autosav_error.log warn;
}
