# ============================================================
# AUTOSAV — VirtualHost Apache production
# Testé avec Apache 2.4 + mod_ssl + mod_rewrite + mod_headers
#
# ⚠️  APPLICABLE UNIQUEMENT SUR VPS / CLOUD / SERVEUR DÉDIÉ AVEC
#     ACCÈS ROOT. Confirmé non applicable sur l'hébergement
#     mutualisé Hostinger actuel de ce projet (pas d'accès aux
#     configs Apache/Nginx/PHP-FPM système). Sur mutualisé, la
#     sécurité équivalente est portée par .htaccess (racine et
#     public/) — voir RUNBOOK_DEPLOIEMENT.md, section "Option A".
#     Conservé ici pour une migration future vers un plan avec
#     accès serveur complet.
# ============================================================

# ── Redirection HTTP → HTTPS ──────────────────────────────
<VirtualHost *:80>
    ServerName devnenad.fr
    ServerAlias www.devnenad.fr

    # Redirection permanente HTTPS avec HSTS preload-ready
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    # Journaux minimaux pour le redirect
    ErrorLog  ${APACHE_LOG_DIR}/autosav_http_error.log
    CustomLog ${APACHE_LOG_DIR}/autosav_http_access.log combined
</VirtualHost>

# ── VirtualHost HTTPS principal ───────────────────────────
<VirtualHost *:443>
    ServerName  devnenad.fr
    ServerAlias www.devnenad.fr

    # ── Document root = public/ uniquement ────────────────
    # Ne jamais pointer sur la racine du projet.
    DocumentRoot /var/www/autosav/current/public

    # ── TLS / SSL ─────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/devnenad.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/devnenad.fr/privkey.pem

    # Protocoles et ciphers conformes BSI TR-02102-2 / Mozilla Modern
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    SSLCompression          off

    # OCSP Stapling (réduit la latence TLS)
    SSLUseStapling          on
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    # ── En-têtes sécurité HTTP (mod_headers requis) ───────
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    Header always unset X-Powered-By
    Header always unset Server

    # Désactiver les informations serveur dans les pages d'erreur
    ServerTokens Prod
    ServerSignature Off

    # ── PHP-FPM (adapter le socket selon la version installée) ──
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # ── Directory public/ ─────────────────────────────────
    <Directory /var/www/autosav/current/public>
        Options -Indexes -FollowSymLinks -MultiViews
        AllowOverride All
        Require all granted

        # Limiter la taille des requêtes (protection contre les uploads massifs)
        LimitRequestBody 10485760

        # Désactiver TRACE (CSRF amplification)
        TraceEnable off
    </Directory>

    # ── Blocage explicite des répertoires sensibles ────────
    # Double protection si DocumentRoot pointe mal sur la racine
    <DirectoryMatch "^/var/www/autosav/current/(Core|Modules|config|vendor|storage|database|tests|docs|deploy|bin)">
        Require all denied
    </DirectoryMatch>

    # ── Blocage des fichiers sensibles ────────────────────
    <FilesMatch "(^\..*|composer\.(json|lock)$|phpunit\.xml|phpstan\.neon|\.env.*|.*\.(sql|log|zip|tar|gz|bak|phar|sh|bat|ps1))$">
        Require all denied
    </FilesMatch>

    # ── Rate limiting basique (mod_ratelimit) ─────────────
    # Limite le transfer rate pour les téléchargements (pas le login)
    <Location /files/>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 400
    </Location>

    # ── Blocage des bots malveillants connus ──────────────
    BrowserMatch "sqlmap" bad_bot
    BrowserMatch "nikto" bad_bot
    BrowserMatch "nessus" bad_bot
    BrowserMatch "nmap" bad_bot
    <If "reqenv('bad_bot') == '1'">
        Require all denied
    </If>

    # ── Journaux structurés JSON-compatible ───────────────
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_with_time
    ErrorLog  ${APACHE_LOG_DIR}/autosav_error.log
    CustomLog ${APACHE_LOG_DIR}/autosav_access.log combined_with_time

    # Rotation des logs (logrotate gère le reste)
    ErrorLogFormat "[%{cu}t] [%-m:%l] [pid %P] %F: %E: [client %a] %M"
</VirtualHost>

# ── Configuration OCSP Stapling globale ───────────────────
SSLStaplingCache "shmcb:/var/run/ocsp(128000)"
