name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, openssl, pdo, pdo_mysql, fileinfo, json, intl, zip, gd
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP syntax (Core/, Modules/, config/, bin/, scripts/, tests/)
        run: |
          set -e
          find Core Modules config bin scripts tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run test suite (tests/Unit/*.php)
        run: composer run test

      - name: Static analysis (PHPStan, niveau 5 + baseline)
        run: composer run stan

      - name: Production readiness check (informational — no real .env in CI)
        run: php scripts/check-production.php || true
